<div class="parallax w-full h-[120vh] relative bg-[#123524] overflow-hidden" #parallaxRef>
  <section class="parallax__header w-full h-full relative">
    <div class="parallax__visuals absolute inset-0 w-full h-full">
      <div class="parallax__black-line-overflow absolute top-0 w-full h-[10vh] bg-gradient-to-b from-[#123524] to-transparent z-20"></div>
      
      <div data-parallax-layers class="parallax__layers relative w-full h-full flex items-center justify-center">
        <!-- Layer 1 (Furthest Back) -->
        <img 
          src="assets/images/produce.jpg" 
          loading="eager" 
          data-parallax-layer="1" 
          alt="Fresh Produce" 
          class="parallax__layer-img absolute w-full h-[140%] object-cover object-center top-[-20%] opacity-40 mix-blend-screen" 
        />
        
        <!-- Layer 2 (Middle) -->
        <img 
          src="assets/images/food_rescue_operation.jpg" 
          loading="eager" 
          data-parallax-layer="2" 
          alt="Food Rescue Operation" 
          class="parallax__layer-img absolute w-[90%] md:w-[70%] h-auto rounded-3xl shadow-2xl top-[10%] object-cover z-10" 
        />
        
        <!-- Layer 3 (Title) -->
        <div data-parallax-layer="3" class="parallax__layer-title absolute z-20 flex flex-col items-center justify-center w-full text-center drop-shadow-2xl">
          <h2 class="parallax__title text-6xl md:text-8xl lg:text-9xl font-black text-white uppercase tracking-tighter mix-blend-overlay">Impact</h2>
          <p class="text-xl md:text-3xl text-[#EFE3C2] font-bold mt-4 uppercase tracking-[0.3em]">At Scale</p>
        </div>
        
        <!-- Layer 4 (Frontest) -->
        <img 
          src="assets/images/hero_food.jpg" 
          loading="eager" 
          data-parallax-layer="4" 
          alt="Community Food" 
          class="parallax__layer-img absolute w-[60%] md:w-[40%] h-auto rounded-3xl shadow-2xl bottom-[-10%] right-[10%] object-cover z-30" 
        />
      </div>
      
      <div class="parallax__fade absolute bottom-0 w-full h-[30vh] bg-gradient-to-t from-[#123524] to-transparent z-40"></div>
    </div>
  </section>
  
  <section class="parallax__content relative z-50 py-24 flex justify-center bg-[#123524]">
    <div class="text-center max-w-3xl px-6">
      <h3 class="text-[#EFE3C2] text-3xl font-bold mb-6">Real-World Change</h3>
      <p class="text-white/80 text-lg leading-relaxed">
        Our community network reaches thousands of people daily. With real-time coordination, food rescue operations happen efficiently and safely, ensuring zero waste and maximum impact.
      </p>
    </div>
  </section>
</div>
